<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sunu École — L'arbre à palabres</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Work+Sans:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>
<body>


<div class="scene" id="scene" data-phase="aube">
  <div class="sky"></div>
  <div class="stars"></div>
  <div class="sun" id="sun"></div>
  <div class="moon" id="moon"></div>
  <div class="clouds"><span class="c1"></span><span class="c2"></span></div>
  <div class="birds"><span>〜</span><span>〜</span><span>〜</span></div>
  <div class="hills"></div>
  <div class="baobab">
    <div class="branch l"></div>
    <div class="branch r"></div>
    <div class="trunk"></div>
    <div class="canopy c1"></div>
    <div class="canopy c2"></div>
    <div class="canopy c3"></div>
    <div class="canopy c4"></div>
  </div>
  <div class="fireflies"><span></span><span></span><span></span><span></span><span></span></div>
  <div class="grass"></div>
  <div class="ground"></div>
</div>

<div class="stagewrap">
  <div class="ropes"><span></span><span></span></div>
  <div class="stage" id="stage"></div>
</div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
